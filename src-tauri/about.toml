# cargo-about config: attribution for crates compiled into the shipped app.
# Generate with: cargo about generate -c about.toml about.hbs
accepted = [
  "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "ISC", "BSD-2-Clause",
  "BSD-3-Clause", "0BSD", "Zlib", "Unicode-3.0", "Unlicense", "CC0-1.0", "MPL-2.0",
  "CDLA-Permissive-2.0", "BSL-1.0",
]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
