name: Feature request
description: Suggest an improvement or a new capability
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Browsing sessions
        - Session view / tool calls
        - Search
        - Usage and credits
        - Analysis (Kiro CLI)
        - Settings
        - Other
