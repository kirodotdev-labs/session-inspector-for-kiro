name: Release desktop app

# Tag a release with `git tag app-v0.1.0 && git push --tags` (or run this
# workflow manually via workflow_dispatch) to build the Tauri desktop app
# for macOS (arm64 + x64), Windows (x64), and Linux (x64), and attach the
# installers to a GitHub Release.
#
# Requires "Read and write permissions" for the GITHUB_TOKEN under
# Settings > Actions > General > Workflow permissions.

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version string (e.g. 0.2.0). Defaults to tauri.conf.json's version."
        required: false

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15 # Apple Silicon (arm64)
            args: "--target aarch64-apple-darwin"
          - platform: macos-15 # Intel (x64), cross-compiled on arm64
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-15' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing — set these as repo Actions secrets. With
          # bundle.createUpdaterArtifacts=true, tauri-action signs the updater
          # artifacts and uploads a generated latest.json to the Release.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: "Kiro Sessions Inspector v__VERSION__"
          releaseBody: |
            Desktop build of Kiro Sessions Inspector for macOS, Windows, and Linux.

            - **macOS**: the `.dmg`/`.app.tar.gz` is ad-hoc signed, not notarized.
              On first launch you may need to right-click → Open, or run:
              `xattr -dr com.apple.quarantine /Applications/Kiro\ Sessions\ Inspector.app`
            - **Windows**: the `.msi`/`.exe` installer is unsigned — Windows
              SmartScreen may warn on first run ("More info" → "Run anyway").
            - **Linux**: `.AppImage` (portable) and `.deb` (Debian/Ubuntu) are provided.
          # Must be a published (non-draft, non-prerelease) release for the
          # updater's /releases/latest/download/latest.json URL to resolve.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  download-aliases:
    name: Publish latest-download links
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test installer alias mapping
        run: python3 scripts/test_publish_download_aliases.py
      - name: Publish stable installer filenames
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish_download_aliases.py
