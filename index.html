<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiro Sessions Inspector</title>
    <!-- Applied the instant the HTML parses, before the external CSS bundle
         round-trips, so there's no white/default flash beneath the loading
         spinner below while the window is visible and the bundle loads. -->
    <style>
      html,
      body {
        background: #0a0a0f;
      }
      #initial-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #initial-loading svg {
        width: 28px;
        height: 28px;
        animation: initial-loading-spin 0.8s linear infinite;
        color: #6366f1;
      }
      @keyframes initial-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Static fallback shown until React mounts and takes over #root;
           removed automatically once real content renders into this node. -->
      <div id="initial-loading" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle
            cx="12"
            cy="12"
            r="9"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-dasharray="40 100"
          />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
